version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: mysql_container
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: Neueda@123
      MYSQL_DATABASE: rest

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - springboot-network

  springboot-app:
    build: .
    container_name: springboot_container

    depends_on:
      - mysql

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rest
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Neueda@123

    ports:
      - "8090:8090"

    networks:
      - springboot-network
